# Passkey demo relying party - Noxno GmbH, https://passkeydemo.noxno.ch
#
# EVERY value below is an EXAMPLE. A real deployment does not edit this file: it supplies the
# real values through the PASSKEY_* environment variables that the Dockerfile entrypoint (and
# docker-compose.yml) map onto these keys. The entrypoint appends the overrides AFTER this file,
# and java.util.Properties lets the last occurrence win, so an env var always beats the line here.
# The env var for each key is named in its comment; the full list is in DEPLOY.md.

# Listen port.                                                         env PASSKEY_PORT
port=8099

# ---------------------------------------------------------------- API base path
# Context path every app-facing endpoint hangs under, so the routes are
# <basePath>/rest/authentication/passkey/... A real backend usually already owns a context path:
# set this to that path and this server becomes a drop-in stand-in for it. Normalised to a leading
# slash and no trailing slash; basePath=/ mounts the API at the root. /demo, /demo/api and
# /.well-known/ are NOT affected - the first two are demo surface, the last is fixed by Apple and
# Google.
# EXAMPLE (neutral default).                                           env PASSKEY_BASE_PATH
basePath=/api

# ---------------------------------------------------------------- relying party
# rpId is what the authenticator hashes into authenticatorData.rpIdHash - changing it invalidates
# every already enrolled passkey. It must be the registrable domain the demo page is served from.
# EXAMPLE: the publisher's own demo host.                              env PASSKEY_RP_ID
rpId=passkeydemo.noxno.ch
# Human-readable name shown in the platform passkey prompt.
# EXAMPLE.                                                             env PASSKEY_RP_NAME
rpName=Noxno Passkey Demo

# Every origin string accepted in clientDataJSON.origin, complete list, comma separated.
# A native authenticator writes clientDataJSON itself, so its origin is whatever the app puts
# there. Android convention: android:apk-key-hash:<base64url SHA-256 of the signing certificate>.
# When this key is missing the accepted set is exactly [https://<rpId>].
# Add the apk-key-hash form once the Android build's signing certificate is known, e.g.
#   # A NATIVE Android app does NOT send https://<rpId> as the clientData origin. Credential Manager
# stamps it as android:apk-key-hash:<base64url SHA-256 of the signing certificate>, so that form
# must be listed here or every ceremony dies at the last step with
#   ATTESTATION_REJECTED: The collectedClientData origin 'android:apk-key-hash:...'
#   doesn't match expected: https://<rpId>
# List one entry per signing certificate that ships: the debug key hash below is NOT the same as
# the Play App Signing one, exactly like androidWebCredentialDigests.
# Derive it with:
#   keytool -list -v -keystore <ks> | grep SHA256 | cut -d" " -f3 | xxd -r -p | base64 | tr +/ -_ | tr -d "="
acceptedOrigins=https://passkeydemo.noxno.ch,android:apk-key-hash:<base64url-sha256-of-signing-cert>
# EXAMPLE.                                                             env PASSKEY_ACCEPTED_ORIGINS
# A NATIVE Android app does NOT send https://<rpId> as the clientData origin. Credential Manager
# stamps it as android:apk-key-hash:<base64url SHA-256 of the signing certificate>, so that form
# must be listed here or every ceremony dies at the last step with
#   ATTESTATION_REJECTED: The collectedClientData origin 'android:apk-key-hash:...'
#   doesn't match expected: https://<rpId>
# List one entry per signing certificate that ships: the debug key hash below is NOT the same as
# the Play App Signing one, exactly like androidWebCredentialDigests.
# Derive it with:
#   keytool -list -v -keystore <ks> | grep SHA256 | cut -d" " -f3 | xxd -r -p | base64 | tr +/ -_ | tr -d "="
acceptedOrigins=https://passkeydemo.noxno.ch

# ---------------------------------------------------------------- attestation policy
# strict = compliance path: only android-key and packed+Apple App Attest are accepted.
# demo   = additionally accept fmt=none so a plain browser passkey can complete the ceremony.
#          Such credentials are stored and listed with attested=false. A browser can demonstrate
#          the passkey CEREMONY, never attestation. Never use demo for anything but a demo.
#                                                                      env PASSKEY_ATTESTATION_POLICY
attestationPolicy=demo
# Directory served at /demo in demo mode; the bundled placeholder answers when it is absent.
#                                                                      env PASSKEY_STATIC_DIR
staticDir=public

# ---------------------------------------------------------------- app identity
# Android application id of the app that enrols passkeys against this server.
# EXAMPLE - substitute the real package name.                          env PASSKEY_ANDROID_PACKAGE_NAME
androidPackageName=com.example.passkeydemo
# lower-case hex SHA-256 of every accepted Android signing certificate (upload key, debug key).
# Empty means "accept any signer" - AndroidKeyAttestationPolicy logs a WARN and waves it through.
# This is the SERVER-SIDE ACCEPTANCE list, checked per registration against the
# attestationApplicationId extension of the android-key certificate. It is NOT the same list as
# androidWebCredentialDigests below, which is published to the whole internet.
# Read it off the keystore that signs the build:
#   keytool -list -v -keystore <keystore> -alias <alias>   ->   "SHA256:", colons stripped
# SHIPPED EMPTY as an example: the public demo accepts any signer during bring-up. Set it and the
# server immediately rejects every build not signed by a listed certificate.
# EXAMPLE (empty).                                                     env PASSKEY_ANDROID_SIGNING_DIGESTS
androidSigningDigests=
# Every Application Identifier of the iOS app, TEAMID.bundleid, comma separated. A release build
# whose bundle id differs from the development one needs BOTH listed, here and therefore in the
# apple-app-site-association file below, which reuses exactly this key.
# EXAMPLE - substitute <TEAM_ID>.<BUNDLE_ID>.                          env PASSKEY_IOS_APP_IDS
iosAppIds=ABCDE12345.com.example.passkeydemo
#                                                                      env PASSKEY_APP_ATTEST_ENVIRONMENTS
appAttestEnvironments=appattest,appattestdevelop
# test only: also accept the AOSP software attestation root (emulators)
#                                                                      env PASSKEY_ALLOW_SOFTWARE_ATTESTATION_ROOT
allowSoftwareAttestationRoot=true

# ------------------------------------------------------- domain association (.well-known)
# The rpId host publishes the two association files. They are served in BOTH strict and demo mode
# - they describe APP IDENTITY, not the demo - and are generated from the keys above so they can
# never drift from the attestation settings.
#   GET /.well-known/apple-app-site-association   {"webcredentials":{"apps":[<iosAppIds>]}}
#   GET /.well-known/assetlinks.json              [{relation:[delegate_permission/
#                                                   common.get_login_creds], target:{android_app,
#                                                   <androidPackageName>, <fingerprints>}}]
#
# WHAT THEY ARE FOR, stated plainly so nobody has to guess:
#   They bind this domain to the mobile apps for PLATFORM PASSKEYS - credentials held by iCloud
#   Keychain / Google Password Manager. Platform passkeys SYNC across every device of the user's
#   Apple/Google account and return attestation "none", which under BSI is trust level "normal"
#   (the "normal" (low-threshold) trust level). The attested, device-bound design - key in the Secure Enclave /
#   StrongBox, android-key resp. packed + Apple App Attest, the app itself as the authenticator -
#   reaches "substantiell" and needs NO association file at all.
#   Both can be live on the same host. Publishing these files opens the CONVENIENCE path with open
#   eyes; it is not a prerequisite for, and not a step towards, the compliance path.
#
# APPLE SILENT-FAILURE CHECKLIST (all of these produce "domain not associated", never an error):
#   - Content-Type MUST be application/json. The AASA path has NO file extension, so nothing may
#     append one and nothing may serve it as text/plain or application/octet-stream.
#   - HTTPS with NO redirect of any kind (not http->https, not apex->www, not trailing-slash
#     normalisation). Apple's CDN does not follow redirects for this file. A reverse proxy in front
#     of this server is the usual culprit - /.well-known/ must proxy_pass straight through.
#   - No auth, no bearer token, no rate limiting. The RateLimiter of this server is called per
#     handler, never as a global before-filter, so these two paths are not covered by it.
#                                                                      env PASSKEY_SERVE_WELL_KNOWN
serveWellKnown=true

# Apple Developer Team ID, the 10-character prefix of an Application Identifier. Used to qualify any
# iosAppIds entry that does not already carry a team id; the AASA list itself comes from iosAppIds.
# Apple Developer portal -> Membership details -> Team ID.
# EXAMPLE - substitute <TEAM_ID>.                                      env PASSKEY_APPLE_TEAM_ID
appleTeamId=ABCDE12345

# SHA-256 certificate digests published in assetlinks.json. Unset -> androidSigningDigests is used,
# so the two lists cannot drift apart by accident. Set it only to make them differ ON PURPOSE:
# androidSigningDigests is a server-side acceptance list, this one is a PUBLIC GRANT that lets any
# app signed by a listed certificate receive this domain's platform passkeys. A debug certificate
# belongs in the first and must NEVER be in the second on a production host - the Android debug
# keystore is unencrypted and uses the well-known password "android".
# Input may be colon separated or not, upper or lower case; the endpoint always emits the
# assetlinks.json spelling (UPPER-CASE hex, colon between every byte).
#
# On a public host, put here - and only here:
#   <PLAY_APP_SIGNING_SHA256>  Play Console -> <app> -> Setup -> App signing ->
#                              "App signing key certificate" -> SHA-256 certificate fingerprint.
#                              This is the key Google re-signs the delivered APK with, so it is the
#                              one Android matches against.
#   <UPLOAD_KEY_SHA256>        keytool -list -v -keystore <keystore> -alias <alias>
#                              -> "SHA256:". Only needed for builds installed outside Play
#                              (internal app sharing / sideloaded release APKs).
# SHIPPED EMPTY ON PURPOSE. This key is a public grant, so the safe default is to grant nothing and
# fail loudly: an empty list makes the server WARN at boot and publish
# "sha256_cert_fingerprints":[], which breaks Android platform passkeys visibly instead of handing
# the grant to a debug certificate silently. Note that an empty list is not a safe middle ground
# either - Google's validator rejects the whole document with ERROR_CODE_MALFORMED_CONTENT, so
# Android passkeys never appear at all until a real fingerprint is supplied.
# NEVER publish a debug signing certificate here on a host that is not throwaway: its keystore
# password is the documented string "android", so the grant is effectively public.
# EXAMPLE (empty).                                            env PASSKEY_ANDROID_WEB_CREDENTIAL_DIGESTS
androidWebCredentialDigests=

# log | enforce                                                        env PASSKEY_VERIFIED_BOOT_POLICY
verifiedBootPolicy=log

#                                                                      env PASSKEY_UNLOCK_WINDOW_SECONDS
unlockWindowSeconds=604800
#                                                                      env PASSKEY_CEREMONY_TTL_SECONDS
ceremonyTtlSeconds=300
#                                                                      env PASSKEY_RATE_LIMIT_PER_MINUTE
rateLimitPerMinute=60
# X-Admin-Token for POST <basePath>/rest/authentication/passkey/admin/reset (hotline recovery).
# The container entrypoint REFUSES to start while this is still "change-me".
#                                                                      env PASSKEY_ADMIN_TOKEN
adminToken=change-me
#                                                                      env PASSKEY_GOOGLE_ROOTS_URL
googleRootsUrl=https://android.googleapis.com/attestation/root
#                                                                      env PASSKEY_GOOGLE_STATUS_URL
googleStatusUrl=https://android.googleapis.com/attestation/status
#                                                                      env PASSKEY_CACHE_DIR
cacheDir=cache
#                                                                      env PASSKEY_VECTORS_DIR
vectorsDir=vectors
#                                                                      env PASSKEY_USERS_FILE
usersFile=users.json
# Unset = the Apple App Attestation Root CA compiled into Config.java.
#                                                                      env PASSKEY_APPLE_ROOT_PEM_PATH
# appleAppAttestRootPemPath=
