# /etc/nginx/sites-available/passkeydemo.noxno.ch
# Reverse proxy for the passkey demo relying party.
#
#   sudo cp deploy/nginx-passkey-demo.conf /etc/nginx/sites-available/passkeydemo.noxno.ch
#   sudo ln -sf /etc/nginx/sites-available/passkeydemo.noxno.ch /etc/nginx/sites-enabled/passkeydemo.noxno.ch
#   sudo nginx -t && sudo systemctl reload nginx
#
# The HTTPS server below references certificates that do not exist yet on a fresh box, so
# nginx -t FAILS until they are issued. Follow DEPLOY.md step 4: bring up the HTTP-only
# bootstrap first, run certbot, then install this file.
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d passkeydemo.noxno.ch \
#        --agree-tos -m <OPS_EMAIL> --no-eff-email \
#        --deploy-hook 'systemctl reload nginx'
#
# This file is included from nginx.conf's http{} block (sites-enabled/*), so map,
# log_format and limit_req_zone below are in the right context. Every name is prefixed
# with "passkey" so it cannot collide with another site on the same box.
#
# ------------------------------------------------------------------------------------
# /.well-known/ IS SERVED, and on purpose. passkeydemo.noxno.ch hosts
# apple-app-site-association and assetlinks.json; the backend renders both from
# application.properties at boot and answers them in strict AND demo mode
# (serveWellKnown, default true). The location block further down proxies them.
#
# Know what they buy before you debug them. They enable PLATFORM passkeys - credentials
# held by iCloud Keychain / Google Password Manager. Those SYNC across the user's
# devices and return WebAuthn attestation "none", which is BSI trust level "normal".
# They are NOT required by, and contribute NOTHING to, the hardware-attested
# device-bound design (Android "android-key", iOS "packed" + Apple App Attest), which
# needs no domain association at all and reaches "substantiell". Both paths coexist on
# this host; DEPLOY.md section 0 has the comparison, section 7a the verification curls.
#
# Two hard Apple requirements the location block exists to satisfy:
#   1. Content-Type: application/json on the AASA response. The file has NO extension,
#      so nginx's mime.types cannot infer it - see the note in that block.
#   2. NO redirect on the https URL. Not 301/302/307/308, not a trailing-slash rewrite,
#      not an http-to-https hop that ends up serving it. Apple does not follow
#      redirects for this file; a redirect reads to iOS as "domain not associated".
#      (The :80 -> :443 redirect below is fine: Apple and Google only ever request the
#      https URL. What must never redirect is the https URL itself.)
#
# A BROWSER at https://passkeydemo.noxno.ch can perform the WebAuthn CEREMONY, and with
# attestationPolicy=demo it can enrol - but its attestation is always "none". Attestation
# is obtainable only from a native app. Nothing in this proxy changes that.
# ------------------------------------------------------------------------------------

# Websocket-safe upgrade handling. The reference server has no websocket endpoint today,
# but Javalin/Jetty may grow one and a proxy that swallows Upgrade is a silent trap.
# The empty branch is '' and NOT 'close' on purpose: an empty proxy_set_header value drops
# the header, which is what lets `keepalive` in the upstream block below actually work.
# With 'close' every upstream connection would be torn down after one request.
map $http_upgrade $passkey_connection_upgrade {
    default upgrade;
    ''      '';
}

# Per-IP rate limiting HAS TO happen here. The server's own limiter keys on the TCP peer
# address (Javalin ctx.ip()); it does not read X-Forwarded-For, so behind this proxy every
# client shares one bucket. Verified empirically: 12 requests with 12 distinct
# X-Forwarded-For values against rateLimitPerMinute=5 produced 5x PASSWORD_INVALID then
# 7x RATE_LIMITED. Keep rateLimitPerMinute high in the app and do the real work here.
limit_req_zone $binary_remote_addr zone=passkey_auth:10m   rate=2r/s;
limit_req_zone $binary_remote_addr zone=passkey_static:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=passkey_conn:10m;
limit_req_status 429;
limit_conn_status 429;

log_format passkey '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time '
                   '"$http_referer" "$http_user_agent"';

upstream passkey_backend {
    # Docker publishes 127.0.0.1:8099; the systemd unit binds the same address:port.
    server 127.0.0.1:8099 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# ---------------------------------------------------------------- :80 -> :443
server {
    listen      80;
    listen      [::]:80;
    server_name passkeydemo.noxno.ch;

    # certbot --webroot writes its token here; must stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Everything else, the two association files included, is redirected to https. That
    # is correct: Apple's CDN and Google's asset-link fetcher only ever request the https
    # URL, so they never see this hop. Do not "fix" a 301 here that you observed with
    # `curl -I http://.../.well-known/apple-app-site-association` - the redirect that
    # matters is one on the https URL, and there is none (see the :443 block).
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- :443
server {
    # `listen ... http2` is the portable spelling: it works on nginx 1.18-1.24
    # (Ubuntu 22.04 / 24.04) and still works, with a deprecation warning, on 1.25+.
    # On nginx >= 1.25.1 you may instead write `listen 443 ssl;` plus `http2 on;`.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name passkeydemo.noxno.ch;

    access_log /var/log/nginx/passkeydemo.noxno.ch.access.log passkey;
    error_log  /var/log/nginx/passkeydemo.noxno.ch.error.log  warn;

    # ------------------------------------------------------------ TLS
    ssl_certificate     /etc/letsencrypt/live/passkeydemo.noxno.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/passkeydemo.noxno.ch/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:PasskeyTLS:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling is deliberately OFF. Let's Encrypt stopped putting an OCSP responder
    # URL into its certificates in 2025, so `ssl_stapling on` would staple nothing and
    # log "ssl_stapling ignored, no OCSP responder URL in the certificate" on every
    # reload - warning noise that trains people to ignore the error log. Re-enable the
    # three lines below (and the resolver) only if you move to a CA that still does OCSP.
    # ssl_stapling            on;
    # ssl_stapling_verify     on;
    # ssl_trusted_certificate /etc/letsencrypt/live/passkeydemo.noxno.ch/chain.pem;
    # resolver                1.1.1.1 9.9.9.9 valid=300s;   # or 127.0.0.53 (systemd-resolved)
    # resolver_timeout        5s;

    # ------------------------------------------------------------ security headers
    # Only set here, never inside a location: an add_header in a location would drop
    # every inherited header from this block.
    # WebAuthn requires a secure context, so HSTS is not optional for this host.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "DENY"           always;
    add_header Referrer-Policy           "no-referrer"    always;
    add_header Cross-Origin-Opener-Policy "same-origin"   always;
    # "preload" is intentionally absent: submitting passkeydemo.noxno.ch to the HSTS preload list
    # is a long-lived commitment and this is a demo host. Add it only if that is intended.
    #
    # A Content-Security-Policy for the demo page (adjust to whatever /demo actually loads;
    # WebAuthn itself needs no external origin):
    # add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;

    server_tokens off;

    # ------------------------------------------------------------ body size
    # An iOS App Attest attestation object plus the WebAuthn attestationObject and the
    # x5c chain run to a few KB. 2m is far above that and still cheap to reject abuse.
    client_max_body_size 2m;
    client_body_timeout  30s;
    client_header_timeout 30s;

    limit_conn passkey_conn 32;

    # Renewals: certbot follows the :80 redirect, but serving the token here too means a
    # renewal still works if someone later drops the redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ------------------------------------------------------------ domain association
    # /.well-known/apple-app-site-association and /.well-known/assetlinks.json, both
    # generated by the backend. What they are for: see the header of this file.
    #
    # SHADOWING - why this cannot break the acme-challenge block above:
    # nginx selects the LONGEST matching PREFIX location, regardless of the order the
    # blocks appear in the file, and a "^~" match then suppresses regex locations
    # entirely. "/.well-known/acme-challenge/" is strictly longer than "/.well-known/",
    # so certbot's token always wins even though this block is written second. Moving
    # either block has no effect. (Never rewrite these as `location ~ ^/\.well-known` -
    # regex locations ARE evaluated in file order and one would shadow the other.)
    #
    # NO REWRITE, no trailing slash, no `return`, no `rewrite` in this block: Apple does
    # not follow redirects for the AASA. `proxy_pass http://passkey_backend;` carries NO
    # URI part, so nginx forwards the request URI unchanged and the leading dot-directory
    # is not normalised away.
    location ^~ /.well-known/ {
        limit_req zone=passkey_static burst=30 nodelay;

        proxy_pass http://passkey_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $passkey_connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_hide_header X-Powered-By;

        # CONTENT TYPE. It comes from the backend, which sets application/json on both
        # documents explicitly (WellKnownController.CONTENT_TYPE). Verify, do not assume:
        #   curl -sS -o /dev/null \
        #        -w '%{http_code} %{num_redirects} %{content_type}\n' \
        #        https://passkeydemo.noxno.ch/.well-known/apple-app-site-association
        # must print exactly: 200 0 application/json
        #
        # If you ever serve these from DISK instead of proxying, that block MUST carry
        #   default_type application/json;
        # because apple-app-site-association has no file extension: mime.types cannot
        # match it and nginx answers application/octet-stream, which Apple rejects. That
        # is the single most common way this breaks.
        #
        # Do NOT add an `add_header` here to force it. An add_header at this level would
        # drop every header inherited from the server block (HSTS, nosniff, ...) - the
        # same rule noted above the security headers. `expires` is a different directive
        # and does not reset that inheritance, which is why only `expires` is used below.
        #
        # Short cache on purpose: Apple's CDN already holds its own copy for about a day,
        # and a long max-age here only adds a second cache you cannot flush.
        expires 5m;
    }

    # Verified 2026-09-06 with this exact file on nginx 1.27 (`nginx -t` clean apart from
    # the known `listen ... http2` deprecation warning), proxying to the reference server:
    #   /.well-known/apple-app-site-association  200  redirects=0  application/json
    #   /.well-known/assetlinks.json             200  redirects=0  application/json
    #   /.well-known/acme-challenge/<token>      404 text/html from /var/www/certbot
    #                                            (i.e. NOT swallowed by the block above)
    #   http://.../.well-known/apple-app-site-association -> 301 to https, as intended
    # The AASA response also still carried HSTS, nosniff, X-Frame-Options, Referrer-Policy
    # and COOP from the server block - confirming that `expires` (unlike `add_header`)
    # does not reset header inheritance.

    # ------------------------------------------------------------ shared proxy setup
    # Repeated in each location on purpose - proxy_set_header, like add_header, does not
    # merge across levels once a location sets one of its own.

    # Passkey + legacy REST API. No trailing slash in the prefix: the legacy login is
    # POST /api/rest/authentication exactly, with nothing after it.
    # /api here is the server's basePath (application.properties basePath / PASSKEY_BASE_PATH).
    # Change one and you MUST change the other, or this location stops matching the API.
    location ^~ /api/rest/authentication {
        limit_req zone=passkey_auth burst=20 nodelay;

        proxy_pass http://passkey_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $passkey_connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # The app already answers Access-Control-Allow-Origin: * itself. Adding CORS
        # headers here as well produces duplicates that browsers reject outright.
        proxy_hide_header X-Powered-By;

        # Ceremony responses are small JSON; buffering them is fine and keeps the
        # upstream connection free.
        proxy_buffering on;
        proxy_buffers   8 16k;
        proxy_buffer_size 16k;
    }

    # Everything else: the browser demo at /demo/ and its open /demo/api namespace
    # (both exist only with attestationPolicy=demo).
    location / {
        limit_req zone=passkey_static burst=60 nodelay;

        proxy_pass http://passkey_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $passkey_connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_hide_header X-Powered-By;
    }
}
